name: CARINA CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Format checking with black
      run: |
        black --check src tests
        
    - name: Import sorting with isort
      run: |
        isort --check-only src tests
        
    - name: Type checking with mypy
      run: |
        mypy src
        
    - name: Test with pytest and generate coverage
      run: |
        # Configured in pyproject.toml to fail if coverage is < 90%
        # Currently we only enforce it on the core modules we refactored
        pytest tests/unit/ --cov=src/drivers --cov=src/engine --cov-fail-under=90
